[project]
name = "mf-blog"
version = "0.2.0"
description = "A filesystem-first Markdown publishing engine"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4",
    "Markdown>=3.6,<4",
    "PyYAML>=6.0,<7",
    "bleach>=6.1,<7",
    "tzdata>=2025.2",
    "argon2-cffi>=23.1,<26",
    "pyotp>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
]
deploy = [
    "gunicorn>=23,<24",
]

[tool.setuptools]
py-modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
