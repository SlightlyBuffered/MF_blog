[package]
name = "mf-blog"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "A filesystem-first Markdown publishing engine"
license = "Apache-2.0"

[dependencies]
ammonia = "4.0"
argon2 = "0.5"
axum = { version = "0.7", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
data-encoding = "2.6"
hmac = "0.12"
mime_guess = "2.0"
pulldown-cmark = "0.12"
rand = "0.8"
regex = "1.11"
roxmltree = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.13"
tera = "1.20"
tokio = { version = "1.41", features = ["fs", "macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
walkdir = "2.5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
